services:
  postgres:
    image: postgres:15-alpine
    container_name: gazette_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gazette_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gazette_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gazette_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gazette_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Istanbul}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - DB_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-gazette_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/data/workflows:ro
      - ./n8n/scripts:/data/scripts:ro
    entrypoint: ["tini", "--", "/bin/sh", "-c", "node /data/scripts/init-setup.js && exec /docker-entrypoint.sh"]
    networks:
      - gazette_net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: gazette_ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-gazette_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    networks:
      - gazette_net

networks:
  gazette_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
